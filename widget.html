<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Straw Hut Media - Instagram Feed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            padding: 20px;
        }

        .instagram-widget {
            max-width: 1200px;
            margin: 0 auto;
        }

        .widget-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-radius: 12px;
            color: white;
        }

        .widget-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .widget-header a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            opacity: 0.95;
            transition: opacity 0.3s;
        }

        .widget-header a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .instagram-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .instagram-post {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .instagram-post:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .instagram-post img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .instagram-post:hover img {
            transform: scale(1.05);
        }

        .post-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(240, 148, 51, 0.9) 0%, rgba(188, 24, 136, 0.9) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 20px;
            text-align: center;
        }

        .instagram-post:hover .post-overlay {
            opacity: 1;
        }

        .post-stats {
            color: white;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
        }

        .post-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .post-caption {
            color: white;
            font-size: 14px;
            line-height: 1.4;
            max-height: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 18px;
            color: #666;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e6683c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            text-align: center;
            padding: 40px 20px;
            color: #dc2743;
            font-size: 16px;
            background: #fff;
            border-radius: 12px;
            margin: 20px;
        }

        .last-updated {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .instagram-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }

            .widget-header h2 {
                font-size: 22px;
            }

            .widget-header a {
                font-size: 16px;
            }

            .post-stats {
                font-size: 14px;
            }

            .post-caption {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="instagram-widget">
        <div class="widget-header">
            <h2>Follow Us on Instagram</h2>
            <a href="https://www.instagram.com/strawhut.media" target="_blank" rel="noopener noreferrer">
                @strawhut.media
            </a>
        </div>

        <div id="instagram-feed">
            <div class="loading">
                <div class="loading-spinner"></div>
                Loading latest posts...
            </div>
        </div>

        <div class="last-updated" id="last-updated"></div>
    </div>

    <script>
        const INSTAGRAM_USERNAME = 'strawhut.media';
        const API_ENDPOINT = '/api/instagram-feed'; // Your backend API endpoint
        const REFRESH_INTERVAL = 60 * 60 * 1000; // 1 hour in milliseconds

        let currentPosts = [];

        // Function to fetch Instagram posts
        async function fetchInstagramPosts() {
            try {
                const response = await fetch(API_ENDPOINT);

                if (!response.ok) {
                    throw new Error('Failed to fetch Instagram posts');
                }

                const data = await response.json();
                currentPosts = data.posts || [];
                renderPosts();
                updateLastRefreshTime();
            } catch (error) {
                console.error('Error fetching Instagram posts:', error);
                showError();
            }
        }

        // Function to render posts
        function renderPosts() {
            const feedContainer = document.getElementById('instagram-feed');

            if (currentPosts.length === 0) {
                feedContainer.innerHTML = '<div class="error-message">No posts available at the moment. Please check back later.</div>';
                return;
            }

            const gridHTML = `
                <div class="instagram-grid">
                    ${currentPosts.map(post => `
                        <a href="${post.permalink}" target="_blank" rel="noopener noreferrer" class="instagram-post">
                            <img src="${post.media_url}" alt="${escapeHtml(post.caption || 'Instagram post')}" loading="lazy">
                            <div class="post-overlay">
                                <div class="post-stats">
                                    <span>❤️ ${formatNumber(post.like_count || 0)}</span>
                                    <span>💬 ${formatNumber(post.comments_count || 0)}</span>
                                </div>
                                ${post.caption ? `<div class="post-caption">${escapeHtml(truncateText(post.caption, 100))}</div>` : ''}
                            </div>
                        </a>
                    `).join('')}
                </div>
            `;

            feedContainer.innerHTML = gridHTML;
        }

        // Function to show error message
        function showError() {
            const feedContainer = document.getElementById('instagram-feed');
            feedContainer.innerHTML = '<div class="error-message">Unable to load Instagram posts. Please try again later.</div>';
        }

        // Function to update last refresh time
        function updateLastRefreshTime() {
            const lastUpdatedEl = document.getElementById('last-updated');
            const now = new Date();
            lastUpdatedEl.textContent = `Last updated: ${now.toLocaleString()}`;
        }

        // Utility functions
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        function truncateText(text, maxLength) {
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize the widget
        fetchInstagramPosts();

        // Set up automatic refresh every hour
        setInterval(fetchInstagramPosts, REFRESH_INTERVAL);

        // Optional: Refresh when tab becomes visible again
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                const lastUpdate = localStorage.getItem('lastInstagramUpdate');
                const now = Date.now();

                // Refresh if it's been more than an hour since last update
                if (!lastUpdate || (now - parseInt(lastUpdate)) > REFRESH_INTERVAL) {
                    fetchInstagramPosts();
                }
            }
        });

        // Store last update time
        function updateLastRefreshTime() {
            const lastUpdatedEl = document.getElementById('last-updated');
            const now = new Date();
            lastUpdatedEl.textContent = `Last updated: ${now.toLocaleString()}`;
            localStorage.setItem('lastInstagramUpdate', now.getTime().toString());
        }
    </script>
</body>
</html>
